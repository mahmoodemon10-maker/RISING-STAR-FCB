<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Signup Form</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 14px;background:#e5e5e5;color:#35383b;font-family:Outfit,Arial,sans-serif}
.page{width:min(100%,520px);text-align:center}
h1{font-family:Georgia,serif;font-style:italic;font-size:clamp(27px,6vw,42px);color:#111;margin:0 0 48px;text-shadow:1px 2px 2px #bbb}
.circle{width:min(100%,470px);height:min(calc(100vw - 28px),470px);aspect-ratio:1/1;flex:0 0 auto;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#e5e5e5;box-shadow:inset 12px 12px 24px #c9c9c9,inset -12px -12px 24px #fff,18px 18px 35px #d0d0d0,-18px -18px 35px #f5f5f5;padding:30px;transition:transform .7s cubic-bezier(.2,.75,.25,1);}
.circle.is-flipped{transform:rotate(360deg)}
.form{transition:none;transform:none;opacity:1;visibility:visible;backface-visibility:visible}
.form{width:min(100%,305px)}
h2{font-size:clamp(30px,7vw,42px);margin:0;font-weight:700;color:#3c4043}
.sub{margin:8px 0 28px;color:#777;font-size:14px}
.fields{display:grid;gap:18px}
.field{display:flex;align-items:center;gap:12px;border-radius:13px;padding:13px 16px;background:#e5e5e5;box-shadow:inset 5px 5px 9px #cfcfcf,inset -5px -5px 9px #fff}
.field svg{width:17px;height:17px;fill:#777;flex-shrink:0}
input{border:0;outline:0;background:transparent;width:100%;font:16px Outfit,Arial;color:#444}
input::placeholder{color:#888}
button{border:0;cursor:pointer;font-family:inherit}
.submit{margin-top:28px;width:100%;padding:14px;border-radius:13px;background:#e5e5e5;box-shadow:6px 6px 12px #c9c9c9,-6px -6px 12px #fff;color:#555;font-weight:700;font-size:15px;letter-spacing:.5px}
.submit:active{box-shadow:inset 4px 4px 8px #c9c9c9,inset -4px -4px 8px #fff}
.switch{font-size:13px;color:#777;margin:22px 0 0}
.switch button{background:none;color:#7b3038;font-weight:700;font-size:14px;padding:0}
.message{min-height:20px;margin:12px 0 0;font-size:13px;color:#4b7650}
@media(max-width:380px){.circle{width:calc(100vw - 28px);height:calc(100vw - 28px);padding:20px}.form{max-width:270px}h1{margin-bottom:35px}}
</style>
</head>
<body>
<main class="page">
  <h1>Login &amp; Signup Form</h1>
  <section class="circle" aria-label="Login and signup form">
    <form class="form" id="authForm">
      <h2 id="heading">Sign Up</h2>
      <p class="sub" id="subheading">Create your account</p>
      <div class="fields" id="fields">
        <label class="field" id="nameField">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/></svg>
          <input id="name" name="name" placeholder="Full name" autocomplete="name">
        </label>
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
          <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>
        </label>
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
          <input id="password" name="password" type="password" placeholder="Password" autocomplete="new-password" required minlength="6">
        </label>
      </div>
      <button class="submit" type="submit" id="submitBtn">CREATE ACCOUNT</button>
      <p class="switch" id="switchText">Already have an account? <button type="button" id="switchBtn">Login</button></p>
      <p class="message" id="message" aria-live="polite"></p>
    </form>
  </section>
</main>
<script>
const form=document.getElementById('authForm');
const circle=document.querySelector('.circle');
const heading=document.getElementById('heading');
const subheading=document.getElementById('subheading');
const nameField=document.getElementById('nameField');
const nameInput=document.getElementById('name');
const password=document.getElementById('password');
const submitBtn=document.getElementById('submitBtn');
const switchText=document.getElementById('switchText');
const switchBtn=document.getElementById('switchBtn');
const message=document.getElementById('message');
let isSignup=true;
switchBtn.addEventListener('click',()=>{
  isSignup=!isSignup;
  circle.classList.toggle('is-flipped');
  heading.textContent=isSignup?'Sign Up':'Login';
  subheading.textContent=isSignup?'Create your account':'Welcome back';
  nameField.style.display=isSignup?'flex':'none';
  nameInput.required=isSignup;
  password.autocomplete=isSignup?'new-password':'current-password';
  submitBtn.textContent=isSignup?'CREATE ACCOUNT':'LOGIN';
  switchText.firstChild.textContent=isSignup?'Already have an account? ':'Don’t have an account? ';
  switchBtn.textContent=isSignup?'Login':'Sign Up';
  message.textContent='';
});
form.addEventListener('submit',(e)=>{
  e.preventDefault();
  message.style.color='#4b7650';
  message.textContent=isSignup
    ?'Form validated! Connect a backend to create an account.'
    :'Form validated! Connect a backend to authenticate your login.';
});
</script>
</body>
</html>
